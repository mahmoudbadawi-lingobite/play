<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>LingoBite Play</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages has no server-side routing, so a refresh on any
      // client-side route (e.g. /play/admin) 404s. This redirects that
      // request back to index.html with the intended path encoded in the
      // query string; a matching script in index.html decodes it back
      // into the real URL before React Router loads.
      var pathSegmentsToKeep = 1; // "play" - the repo name segment of the URL

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
